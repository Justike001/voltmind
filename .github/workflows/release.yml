name: Release

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  BUN_VERSION: 1.3.14

jobs:
  preflight:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Match tag to package version
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$EXPECTED" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $EXPECTED" >&2
            exit 1
          }
      - name: Require this commit on origin/master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Require successful Test workflow for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=50"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url" | jq -e \
            '.workflow_runs | any(.event == "push" and .head_branch == "master" and .head_sha == env.GITHUB_SHA)'

  build:
    name: Build ${{ matrix.artifact }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: voltmind-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: voltmind-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: voltmind-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compile
        run: bun build --compile --target=${{ matrix.target }} --outfile bin/${{ matrix.artifact }} src/cli.ts
      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          cd bin
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = '${{ matrix.artifact }}'
          $hash = (Get-FileHash -Algorithm SHA256 "bin/$name").Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -NoNewline -Encoding ascii "bin/$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/${{ matrix.artifact }}
            bin/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Assemble and verify release assets
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum --check voltmind-darwin-arm64.sha256
          sha256sum --check voltmind-linux-x64.sha256
          sha256sum --check voltmind-windows-x64.exe.sha256
          sha256sum voltmind-darwin-arm64 voltmind-linux-x64 voltmind-windows-x64.exe > SHA256SUMS
      - name: Generate signed build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/voltmind-darwin-arm64
            release-assets/voltmind-linux-x64
            release-assets/voltmind-windows-x64.exe
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
